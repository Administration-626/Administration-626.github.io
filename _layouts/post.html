---
layout: default
---
<main class="container">
    <article class="post-content">
        <h1>{{ page.title }}</h1>
        <div class="post-meta">
            发布于 {{ page.date | date: "%Y年%m月%d日" }} | 作者: {{ site.author }}
            {% if page.tags.size > 0 %}
            <div class="post-tags">
                {% for tag in page.tags %}
                <span class="tag">#{{ tag }}</span>
                {% endfor %}
            </div>
            {% endif %}
        </div>
        
        {{ content }}
    </article>
</main>
